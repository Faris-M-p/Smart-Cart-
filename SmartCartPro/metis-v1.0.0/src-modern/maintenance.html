<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="description" content="The dashboard is temporarily offline for scheduled maintenance.">
    <meta name="robots" content="noindex">

    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
    <link rel="icon" type="image/png" href="./assets/icons/favicon.png">

    <title>Scheduled maintenance &middot; Metis</title>

    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="./manifest.json">
</head>

<body data-page="maintenance">
    <div class="error-layout">
        <header class="error-topbar d-flex align-items-center justify-content-between">
            <a class="auth-brand" href="./index.html">
                <img src="./assets/images/logo.svg" alt="">
                <span>Metis</span>
            </a>
            <button type="button" class="btn btn-sm btn-outline-secondary" data-theme-toggle aria-label="Toggle colour theme">
                <i class="bi bi-sun-fill theme-icon-light"></i>
                <i class="bi bi-moon-fill theme-icon-dark d-none"></i>
            </button>
        </header>

        <main class="error-body">
            <div class="error-inner">
                <p class="error-status"><i class="bi bi-tools"></i>Scheduled maintenance</p>
                <p class="error-code"><i class="bi bi-hourglass-split"></i></p>
                <h1 class="error-title">Back in about 30 minutes</h1>
                <p class="error-text">
                    We're applying a database upgrade. The dashboard is read-only until it finishes &mdash;
                    no data is being lost, and any work in progress has been saved.
                </p>
                <div class="error-actions">
                    <button type="button" class="btn btn-primary" disabled>
                        <i class="bi bi-activity me-1"></i>View status page
                    </button>
                    <button type="button" class="btn btn-outline-secondary" data-reload>
                        <i class="bi bi-arrow-clockwise me-1"></i>Check again
                    </button>
                </div>
                <p class="error-meta"><i class="bi bi-clock"></i>Started 09:00 UTC &middot; expected back by 09:30 UTC</p>
            </div>
        </main>

        <footer class="error-footer">Updates are posted to the status page.</footer>
    </div>

    <script type="module" src="./scripts/auth.js"></script>
</body>
</html>
